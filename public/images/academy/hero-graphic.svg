<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1000" width="100%" height="100%">
  <defs>
    <linearGradient id="heroCardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14243A"/>
      <stop offset="100%" stop-color="#0A1320"/>
    </linearGradient>
    <linearGradient id="goldH" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D8C294"/>
      <stop offset="50%" stop-color="#B79559"/>
      <stop offset="100%" stop-color="#9E7D42"/>
    </linearGradient>
    <radialGradient id="spotlight" cx="60%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#B79559" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#14243A" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Ambient Backdrop -->
  <rect width="900" height="1000" rx="16" fill="url(#heroCardGrad)"/>
  <circle cx="500" cy="400" r="400" fill="url(#spotlight)"/>

  <!-- Ornate Decorative Lines -->
  <rect x="24" y="24" width="852" height="952" rx="12" fill="none" stroke="#B79559" stroke-width="1" stroke-opacity="0.3"/>
  <circle cx="450" cy="380" r="220" fill="none" stroke="#B79559" stroke-width="0.75" stroke-dasharray="6 6" stroke-opacity="0.4"/>
  <circle cx="450" cy="380" r="160" fill="none" stroke="#B79559" stroke-width="0.5" stroke-opacity="0.2"/>

  <!-- Judicial Pillars Silhouette -->
  <g transform="translate(450, 420)" fill="none" stroke="#B79559" stroke-opacity="0.3" stroke-width="1.5">
    <!-- Pediment -->
    <polygon points="0,-180 -140,-120 140,-120" fill="#1C3352" fill-opacity="0.4"/>
    <!-- Columns -->
    <line x1="-100" y1="-120" x2="-100" y2="40" stroke-width="6"/>
    <line x1="-33" y1="-120" x2="-33" y2="40" stroke-width="6"/>
    <line x1="33" y1="-120" x2="33" y2="40" stroke-width="6"/>
    <line x1="100" y1="-120" x2="100" y2="40" stroke-width="6"/>
    <!-- Base -->
    <rect x="-140" y="40" width="280" height="20" fill="#14243A" stroke-width="1"/>
  </g>

  <!-- Central Emblem: Precision & Law -->
  <g transform="translate(450, 260)" stroke="url(#goldH)" stroke-width="2" fill="none">
    <circle cx="0" cy="0" r="45" fill="#08101A" stroke-width="2"/>
    <!-- Stylized balance scales -->
    <line x1="0" y1="-25" x2="0" y2="25"/>
    <line x1="-22" y1="-10" x2="22" y2="-10"/>
    <polygon points="-22,-10 -30,10 -14,10" fill="#B79559" fill-opacity="0.5"/>
    <polygon points="22,-10 14,10 30,10" fill="#B79559" fill-opacity="0.5"/>
  </g>

  <!-- Academy Motto Ribbon -->
  <rect x="180" y="580" width="540" height="60" rx="4" fill="#0A1320" stroke="#B79559" stroke-width="1"/>
  <text x="450" y="618" font-family="Cinzel, serif" font-size="15" font-weight="700" fill="#D8C294" text-anchor="middle" letter-spacing="3">
    THE LAWGICAL ACADEMY
  </text>

  <!-- Floating Info Tags -->
  <rect x="70" y="700" width="360" height="90" rx="8" fill="#101E31" stroke="#B79559" stroke-width="1" stroke-opacity="0.5"/>
  <text x="100" y="736" font-family="Cinzel, serif" font-size="13" font-weight="600" fill="#FFFFFF">CIVIL JUDGE EXAM SUITE</text>
  <text x="100" y="764" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#B79559">BNS • BNSS • BSA • CPC • Local Acts</text>

  <rect x="470" y="700" width="360" height="90" rx="8" fill="#101E31" stroke="#B79559" stroke-width="1" stroke-opacity="0.5"/>
  <text x="500" y="736" font-family="Cinzel, serif" font-size="13" font-weight="600" fill="#FFFFFF">ADPO PROSECUTION BATCH</text>
  <text x="500" y="764" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#B79559">Special & Minor Criminal Enactments</text>

  <!-- Prototype Notice Footer Plaque -->
  <rect x="140" y="840" width="620" height="60" rx="6" fill="#08101A" stroke="#B79559" stroke-width="0.8" stroke-dasharray="4 4"/>
  <text x="450" y="876" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#D8C294" text-anchor="middle">
    [OFFICIAL ACADEMY PHOTOGRAPHS READY FOR DIRECT REPLACEMENT]
  </text>
</svg>

