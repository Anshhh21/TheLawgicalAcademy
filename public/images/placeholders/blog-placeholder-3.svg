<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="b3Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E1A2B"/>
      <stop offset="100%" stop-color="#14243A"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#b3Grad)"/>
  <rect x="30" y="30" width="1140" height="615" fill="none" stroke="#B79559" stroke-width="1.5" stroke-opacity="0.3"/>
  <!-- Statute Pillars / Temple of Justice Graphic -->
  <g transform="translate(600, 310)" stroke="#B79559" stroke-width="2.5" fill="none">
    <!-- Pediment (Triangle) -->
    <polygon points="0,-130 -180,-60 180,-60" fill="#1C3352" stroke="#B79559" stroke-width="3"/>
    <!-- Frieze -->
    <rect x="-180" y="-60" width="360" height="20" fill="#0E1A2B"/>
    <!-- 4 Pillars -->
    <rect x="-160" y="-40" width="40" height="150" fill="#14243A"/>
    <rect x="-70" y="-40" width="40" height="150" fill="#14243A"/>
    <rect x="30" y="-40" width="40" height="150" fill="#14243A"/>
    <rect x="120" y="-40" width="40" height="150" fill="#14243A"/>
    <!-- Base steps -->
    <rect x="-200" y="110" width="400" height="20" fill="#0E1A2B"/>
    <rect x="-220" y="130" width="440" height="20" fill="#08101A"/>
  </g>
  <rect x="380" y="520" width="440" height="60" rx="3" fill="#08101A" fill-opacity="0.9" stroke="#B79559" stroke-width="1"/>
  <text x="600" y="556" font-family="Cinzel, serif" font-size="16" font-weight="700" fill="#D8C294" text-anchor="middle" letter-spacing="2">
    BARE ACT MASTERY TECHNIQUES
  </text>
</svg>

