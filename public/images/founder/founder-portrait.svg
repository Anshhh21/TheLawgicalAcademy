<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E1A2B"/>
      <stop offset="60%" stop-color="#14243A"/>
      <stop offset="100%" stop-color="#08101A"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D8C294"/>
      <stop offset="50%" stop-color="#B79559"/>
      <stop offset="100%" stop-color="#7E6332"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="38%" r="40%">
      <stop offset="0%" stop-color="#B79559" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#14243A" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="1000" fill="url(#bgGrad)"/>
  <circle cx="400" cy="380" r="300" fill="url(#halo)"/>

  <!-- Ornate Corner Accents -->
  <path d="M 40 70 L 40 40 L 70 40" stroke="url(#goldGrad)" stroke-width="2" fill="none"/>
  <path d="M 760 70 L 760 40 L 730 40" stroke="url(#goldGrad)" stroke-width="2" fill="none"/>
  <path d="M 40 930 L 40 960 L 70 960" stroke="url(#goldGrad)" stroke-width="2" fill="none"/>
  <path d="M 760 930 L 760 960 L 730 960" stroke="url(#goldGrad)" stroke-width="2" fill="none"/>

  <!-- Decorative Inner Border -->
  <rect x="50" y="50" width="700" height="900" fill="none" stroke="#B79559" stroke-width="1" stroke-opacity="0.3"/>
  <rect x="58" y="58" width="684" height="884" fill="none" stroke="#B79559" stroke-width="0.5" stroke-opacity="0.15" stroke-dasharray="4 4"/>

  <!-- Stylized Figure Silhouette -->
  <g transform="translate(400, 420)" fill="none" stroke="url(#goldGrad)">
    <!-- Head -->
    <circle cx="0" cy="-140" r="70" stroke-width="2.5" fill="#14243A" fill-opacity="0.8"/>
    <!-- Collar & Gown / Blazer Silhouette -->
    <path d="M -150 160 C -140 30, -80 -30, -50 -60 L 0 -10 L 50 -60 C 80 -30, 140 30, 150 160 Z" stroke-width="2.5" fill="#0E1A2B" fill-opacity="0.9"/>
    <!-- Tie / Jabot -->
    <path d="M -12 -10 L 0 50 L 12 -10 Z" fill="#B79559" fill-opacity="0.4" stroke-width="1.5"/>
    <line x1="0" y1="50" x2="0" y2="160" stroke-width="1.5" stroke-dasharray="3 3"/>
  </g>

  <!-- Law Scales Emblem Background -->
  <g transform="translate(400, 200)" stroke="#B79559" stroke-width="1" stroke-opacity="0.2" fill="none">
    <line x1="0" y1="-60" x2="0" y2="60"/>
    <line x1="-80" y1="-40" x2="80" y2="-40"/>
    <path d="M -80 -40 L -100 10 L -60 10 Z"/>
    <path d="M 80 -40 L 60 10 L 100 10 Z"/>
  </g>

  <!-- Typography Plaque -->
  <rect x="120" y="760" width="560" height="130" rx="4" fill="#08101A" fill-opacity="0.9" stroke="#B79559" stroke-width="1.5"/>
  <text x="400" y="805" font-family="Cinzel, serif" font-size="20" font-weight="700" fill="#D8C294" text-anchor="middle" letter-spacing="3">
    [FOUNDER PHOTOGRAPH]
  </text>
  <text x="400" y="835" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" fill="#B79559" text-anchor="middle" letter-spacing="1.5">
    OFFICIAL PHOTOGRAPH AWAITING INSERTION
  </text>
  <text x="400" y="865" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#FFFFFF" fill-opacity="0.6" text-anchor="middle">
    Standard Portrait Ratio 4:5 • High-Resolution Image Ready
  </text>
</svg>

